# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# Every job runs in a fresh container of this image: packages installed by one job are not seen by
# the others, so each job installs only what it needs. buildpack-deps:trixie is Debian 13 with the
# build tools already in: GCC 14, make, autoconf/automake/libtool, pkg-config, git and the zlib,
# bzip2 and curl headers. Its apt provides clang 19, CMake 3.31 and Doxygen 1.9.8.
image:
  name: buildpack-deps:trixie

variables:
  GIT_SUBMODULE_STRATEGY: normal
  DEBIAN_FRONTEND: noninteractive
  # Compilers are named explicitly: left to itself, CMake takes /usr/bin/cc and c++, which are GCC 14.
  # Every job that configures (build, create-pages) must install clang, and llvm for llvm-ar, used by
  # the link-time optimisation of the release build. For GCC 14, set CC: gcc and CXX: g++.
  CC: clang
  CXX: clang++

stages:
- build
- test
- deploy

build:
  stage: build
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends cmake libgsl-dev clang llvm gdb libboost-filesystem-dev libboost-chrono-dev libboost-thread-dev libboost-regex-dev npm
  script:
    # Same presets as on the workstations (CMakePresets.json): Release build in build/
    - cmake --preset default -DCI_CIWORKER=ON
    - cmake --build --preset default --parallel 2
  artifacts:
    expire_in: 2 hrs
    paths:
    - build

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  before_script:
    # cmake for ctest, GSL for the test executables
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends cmake libgsl-dev clang gdb libboost-filesystem-dev libboost-chrono-dev libboost-thread-dev libboost-regex-dev npm
  script:
  - ctest --preset default

create-pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends cmake libgsl-dev clang llvm doxygen graphviz npm
  script:
    - mkdir public
    - npm install mathjax@2
    # Configure again: the build job had no Doxygen, so its build tree has no doc target (nothing is recompiled)
    - cmake --preset default -DCI_CIWORKER=ON
    - cmake --build --preset default --target doc
    - mv build/doc/html/* ./public
    - mv node_modules/mathjax ./public/mathjax
    - ls public
  pages:
    expire_in: 1 week
